<!DOCTYPE html>
<!-- lang is set by i18n.js from the parent's choice; this is only the value before it runs. -->
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lanternina</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="page">

  <header class="masthead">
    <div class="masthead-row">
      <h1>Lanternina</h1>
      <div class="language">
        <label for="lang" data-i18n="language.label"></label>
        <select id="lang" data-i18n-label="language.label"></select>
      </div>
    </div>
    <p class="lede" id="lede" data-i18n="lede.checking"></p>
  </header>

  <!-- Exactly one of these is visible at a time; app.js owns which. -->

  <section id="view-loading" class="card">
    <p class="muted" data-i18n="loading.moment"></p>
  </section>

  <section id="view-signedout" class="card hidden">
    <h2 data-i18n="signin.title"></h2>
    <p data-i18n="signin.body"></p>
    <div class="actions">
      <button id="btn-signin" class="primary" data-i18n="signin.button"></button>
    </div>
  </section>

  <section id="view-connecting" class="card hidden" aria-live="polite">
    <h2 data-i18n="panel.title"></h2>
    <p id="connecting-account" class="muted"></p>
    <dl class="facts">
      <dt data-i18n="facts.status"></dt><dd data-i18n="connecting.loading"></dd>
    </dl>
    <p class="muted" data-i18n="connecting.note"></p>
  </section>

  <section id="view-pending" class="card hidden">
    <h2 data-i18n="pending.title"></h2>
    <p data-i18n="pending.body"></p>
    <p class="muted" data-i18n="pending.note"></p>
    <div class="actions">
      <button id="btn-signout-pending" data-i18n="signout"></button>
    </div>
  </section>

  <section id="view-dashboard" class="card hidden">
    <h2 data-i18n="panel.title"></h2>
    <p id="greeting" class="muted"></p>

    <dl class="facts" id="account-facts"></dl>

    <div class="workspace">
      <button class="menu-toggle" id="menu-toggle" type="button"
              popovertarget="menu-drawer" data-i18n-label="menu.open">
        <span class="menu-icon" aria-hidden="true">☰</span>
        <span id="menu-toggle-text"></span>
      </button>

      <!-- One button per feature. app.js shows exactly one panel and marks it current. -->
      <aside class="side" id="menu-drawer" popover>
        <button class="menu-close" id="menu-close" type="button" popovertarget="menu-drawer"
                popovertargetaction="hide" data-i18n-label="menu.close">
          <span aria-hidden="true">×</span>
        </button>
        <nav class="menu" id="menu" data-i18n-label="menu.aria">
          <button type="button" data-panel="proposals" data-i18n="proposals.title"></button>
          <button type="button" data-panel="pictures" data-i18n="pictures.title"></button>
          <button type="button" data-panel="themes" data-i18n="themes.title"></button>
          <button type="button" data-panel="rhythm" data-i18n="rhythm.title"></button>
          <button type="button" data-panel="devices" data-i18n="devices.title"></button>
          <button type="button" data-panel="usage" data-i18n="usage.title"></button>
        </nav>
      </aside>

      <div class="work">
        <div class="panel" id="panel-proposals">
          <p class="muted" data-i18n="proposals.note"></p>
          <div id="proposals" aria-live="polite"></div>
        </div>

        <div class="panel hidden" id="panel-pictures">
          <p class="muted" data-i18n="pictures.note"></p>
          <div id="pictures" class="gallery" aria-live="polite"></div>
          <div class="actions">
            <button id="btn-more-pictures" class="hidden" data-i18n="pictures.more"></button>
          </div>
        </div>

        <div class="panel hidden" id="panel-themes">
          <p class="muted" data-i18n="themes.note"></p>
          <form id="theme-form" class="theme-form">
            <input id="theme-input" type="text" maxlength="80" autocomplete="off"
                   data-i18n-placeholder="themes.placeholder" data-i18n-label="themes.aria" />
            <button type="submit" class="primary" data-i18n="themes.add"></button>
          </form>
          <p id="theme-error" class="muted hidden"></p>
          <div id="themes" aria-live="polite"></div>
        </div>

        <div class="panel hidden" id="panel-rhythm">
          <p class="muted" data-i18n="rhythm.note"></p>
          <form id="rhythm-form" class="rhythm-form">
            <label for="quiet-from" data-i18n="rhythm.quietFrom"></label>
            <select id="quiet-from"></select>
            <label for="quiet-until" data-i18n="rhythm.quietUntil"></label>
            <select id="quiet-until"></select>
            <label for="cadence" data-i18n="rhythm.cadence"></label>
            <select id="cadence"></select>
            <button type="submit" class="primary" data-i18n="rhythm.save"></button>
          </form>
          <p id="rhythm-status" class="muted" aria-live="polite"></p>
        </div>

        <div class="panel hidden" id="panel-devices">
          <p class="muted" data-i18n="devices.note"></p>
          <div id="devices" aria-live="polite"></div>
        </div>

        <div class="panel hidden" id="panel-usage">
          <p class="muted" data-i18n="usage.note"></p>
          <div id="usage" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="btn-signout" data-i18n="signout"></button>
    </div>
  </section>

  <section id="view-error" class="card hidden">
    <h2 data-i18n="error.title"></h2>
    <p id="error-text"></p>
    <div class="actions">
      <button id="btn-retry" data-i18n="error.retry"></button>
      <button id="btn-signout-error" data-i18n="signout"></button>
    </div>
  </section>

  <!-- TODO(poc): a development aid, not something a parent should ever see. Remove before
       anyone outside this project uses the panel. -->
  <details id="diagnostics" class="diagnostics hidden">
    <summary data-i18n="diag.summary"></summary>
    <div>
      <h3 data-i18n="diag.claims"></h3>
      <pre id="claims">—</pre>
      <h3><span data-i18n="diag.apiresult"></span> <code>/api/me</code></h3>
      <pre id="apiresult">—</pre>
    </div>
  </details>

</main>

<!-- Deliberately unpinned. The cost is that a release changes this panel without us
     acting, and that SRI cannot be used: its hash is tied to one exact file. -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@latest/lib/msal-browser.min.js"
  crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
