    <path d="M6.4 20.2h11.2" />
  </g>
  <path
    d="M16 16.71c1.354 1.198 1.875 2.083 1.875 2.969a1.875 1.875 0 0 1-3.75 0c0-.886.521-1.771 1.875-2.969z"
