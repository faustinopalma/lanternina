[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lanternina"
version = "0.0.1"
description = "A parent-steered system that invents an afternoon for an adolescent and runs it in a house."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately small. The router is the only component allowed to grow cloud
# dependencies, and it keeps them behind an extra.
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Nothing imports cv2 any more: the marker-and-QR reader is in attic/, and a page is read
# by handing a model the blank and what came back. Kept for the attic and for whatever the
# handheld camera turns out to need on the hub. Headless: the mini-PC has no desktop.
vision = ["opencv-contrib-python-headless>=4.9", "numpy>=1.24", "Pillow>=10.0"]
# Azure AI Foundry + Content Safety. Entra ID only, no API keys.
# `openai` is the transport for every model call. It is the client Azure's own endpoint
# speaks, and it carries the retry-with-backoff, the `Retry-After` handling and the body
# of a refusal that `orchestrator/router.py` used to keep correct by hand. Two packages
# on top of what was already installed, measured 25 August 2026.
cloud = [
    "azure-identity>=1.17",
    "azure-ai-contentsafety>=1.0",
    "openai>=1.99",
    "httpx>=0.27",
]
# On-device inference is deliberately out of scope: every model call goes to Azure.
# See docs/ARCHITECTURE.md; tests/test_boundaries.py fails if a local runtime is imported.
# PyJWT floor is 2.13 because that is the version whose key-handling behaviour the
# algorithm-confusion test was verified against.
panel = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.13,<3",
    "azure-cosmos>=4.7",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    # The panel paints when the home server asks, so it screens, renders and calls models.
    "openai>=1.99",
    "azure-ai-contentsafety>=1.0",
    # The async Content Safety client needs an async transport, and does not declare it.
    "aiohttp>=3.9",
    # `zoneinfo` ships no database of its own. Verified 25 August 2026: on Windows and in
    # python:3.13-slim every `ZoneInfo("Europe/Rome")` raises without this, so the panel
    # would refuse every timezone a parent picked. The hub does not need it — Raspberry Pi
    # OS has /usr/share/zoneinfo — and everything here is stdlib on purpose.
    "tzdata>=2024.1",
    "Pillow>=10.0",
    # What the panel says about itself, and the half nobody writes: request timings, which
    # model call was slow inside one, which Cosmos query. The distro instruments FastAPI,
    # httpx and the Azure SDKs without anything being annotated. Optional at runtime —
    # `panel/observability.py` starts without it and says so.
    "azure-monitor-opentelemetry>=1.6",
]
# Serial link to the ESP32 devices.
devices = ["pyserial>=3.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "orchestrator*", "agents*", "vision*", "panel*", "printing*", "devices*"]

[tool.setuptools.package-data]
shared = ["py.typed", "*.md"]
# What a model is told lives in Markdown beside the module that sends it. An installed
# package without these files imports and then raises FileNotFoundError on the first call,
# so they are data and not documentation.
agents = ["*.md"]
panel = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The attic is kept for its argument, not for its use. Nothing imports it, nothing runs it,
# and holding it to the current style would mean editing retired code to say the same thing.
exclude = ["attic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Third-party stubs are patchy for OpenCV; the vision package is checked loosely.
module = ["cv2.*"]
ignore_missing_imports = true
