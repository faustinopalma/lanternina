<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fotografie | Lanternina</title>
<script>(()=>{const param=new URLSearchParams(window.location.search).get("scoutTheme");document.documentElement.setAttribute("data-theme",param||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));})();</script>
<style>
:root {color-scheme:light;--cp-bg:#f7f4ef;--cp-bg-elevated:#fcfbf8;--cp-surface:#ffffff;--cp-surface-soft:#f5f5f5;--cp-border:#dedede;--cp-border-strong:#919191;--cp-text:#242424;--cp-text-muted:#5c5c5c;--cp-text-soft:#6f6f6f;--cp-accent:#b11f4b;--cp-accent-hover:#9a1a41;--cp-accent-soft:rgba(177,31,75,.08);--cp-accent-fg:#ffffff;--cp-success:#16a34a;--cp-danger:#dc2626;--cp-warning:#f59e0b;--cp-link:#0078d4;--cp-shadow:0 18px 48px rgba(0,0,0,.12);--cp-overlay:rgba(255,255,255,.8);--cp-panel:rgba(255,255,255,.86);--cp-panel-strong:rgba(255,255,255,.96);--cp-sheen:rgba(255,255,255,.55);--cp-highlight:rgba(177,31,75,.12)}
html[data-theme="dark"] {color-scheme:dark;--cp-bg:#3d3b3a;--cp-bg-elevated:#343231;--cp-surface:#292929;--cp-surface-soft:#2e2e2e;--cp-border:#474747;--cp-border-strong:#5f5f5f;--cp-text:#dedede;--cp-text-muted:#919191;--cp-text-soft:#b0b0b0;--cp-accent:#fd8ea1;--cp-accent-hover:#fb7b91;--cp-accent-soft:rgba(253,142,161,.14);--cp-accent-fg:#1a1a1a;--cp-success:#4ade80;--cp-danger:#f87171;--cp-warning:#fbbf24;--cp-link:#4da6ff;--cp-shadow:0 18px 48px rgba(0,0,0,.32);--cp-overlay:rgba(41,41,41,.88);--cp-panel:rgba(41,41,41,.72);--cp-panel-strong:rgba(41,41,41,.96);--cp-sheen:rgba(255,255,255,.04);--cp-highlight:rgba(253,142,161,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--cp-surface-soft);color:var(--cp-text);font-family:"Segoe UI",Aptos,Calibri,sans-serif;letter-spacing:0}header{padding:24px 5%;border-bottom:1px solid var(--cp-border);background:var(--cp-surface)}h1{font-size:26px;font-weight:500;margin:6px 0}small,time{color:var(--cp-text-muted)}main{max-width:1440px;margin:auto;padding:24px 5%}#photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:24px}figure{margin:0;min-width:0}img{width:100%;height:300px;object-fit:contain;background:var(--cp-surface);display:block;border:1px solid var(--cp-border)}figcaption{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 0}time{flex:1;font-size:14px}button,a{color:var(--cp-link);font:inherit}button{cursor:pointer;border:1px solid var(--cp-border);background:var(--cp-surface);padding:8px 12px;border-radius:4px}button:hover{border-color:var(--cp-border-strong)}p[role=status]{min-height:24px}.state{display:block;width:100%;font-size:13px;color:var(--cp-text-muted)}
</style></head><body><header><small>Lanternina</small><h1>Fotografie</h1></header><main><p id="status" role="status">Caricamento...</p><div id="photos"></div></main>
<script>
const status=document.getElementById('status');
async function load(){try{const response=await fetch('/photos');if(!response.ok)throw new Error();const photos=await response.json();document.getElementById('photos').replaceChildren();status.textContent=photos.length?`${photos.length} fotografie`:'Nessuna fotografia';for(const photo of photos){const figure=document.createElement('figure');const image=document.createElement('img');image.src='/photos/'+photo.id;image.alt='Fotografia';image.loading='lazy';const caption=document.createElement('figcaption');const time=document.createElement('time');time.textContent=new Date((photo.captured||photo.received)*1000).toLocaleString('it-IT');const download=document.createElement('a');download.href=image.src;download.download=photo.id+'.jpg';download.textContent='Scarica';const remove=document.createElement('button');remove.textContent='Elimina';remove.addEventListener('click',async()=>{if(!confirm('Eliminare questa fotografia?'))return;remove.disabled=true;try{const result=await fetch(image.src,{method:'DELETE',headers:{'X-Photo-Action':'delete'}});if(!result.ok)throw new Error();await load();}catch{status.textContent='La fotografia non è stata eliminata.';remove.disabled=false;}});caption.append(time,download,remove);if(photo.state==='failed'||photo.state==='processing'){const state=document.createElement('span');state.className='state';state.textContent=photo.state==='failed'?'Foto conservata. Elaborazione non riuscita.':'Foto conservata. Elaborazione in corso o interrotta.';caption.append(state);}figure.append(image,caption);document.getElementById('photos').append(figure);}}catch{status.textContent='Non riesco a caricare le fotografie.'}}
load();
</script></body></html>
