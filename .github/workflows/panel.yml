# Build the parent's panel and publish it to the Static Web App.
#
# The API is deployed separately, from scripts/deploy.ps1: this workflow touches the
# browser tier only. Nothing here reaches the server in the home.
name: panel

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/panel.yml"
  workflow_dispatch:

# One publish at a time. Two overlapping runs would race for the same site.
concurrency:
  group: panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly the lockfile, so what is published is what was tested.
      - run: npm ci
        working-directory: web

      - run: npm test
        working-directory: web

      # Runs `tsc --noEmit` first, so a type error stops the publish rather than shipping.
      - run: npm run build
        working-directory: web

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Already built above; the action must publish, not build again.
          skip_app_build: true
          app_location: web/dist
          output_location: ""
