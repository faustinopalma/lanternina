# Build the public pages and publish them to their own Static Web App.
#
# A different site from the parent's panel: that one is app.lanternina.com and is built by
# panel.yml. This one is Astro, and it emits one directory of real HTML per language —
# /en/ and /it/ — because a crawler has to find them as separate documents.
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One publish at a time. Two overlapping runs would race for the same site.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` installs exactly the lockfile, so what is published is what was checked.
      - run: npm ci
        working-directory: site

      # Runs `astro check` first, so a broken reference stops the publish.
      - run: npm run build
        working-directory: site

      # The guard that matters for this site: the two language trees have to have the same
      # shape, every canonical has to be the directory the file was written to, and every
      # hreflang has to point at a page that was actually built. Getting any of those wrong
      # costs indexing quality and nothing would report it at runtime.
      - name: check the built site
        run: python3 site/check-build.py

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SITE }}
          action: upload
          # Built above; the action must publish, not build again.
          skip_app_build: true
          app_location: site/dist
          output_location: ""
