# Publish the public page to its own Static Web App.
#
# A different site from the parent's panel: that one is app.lanternina.com and is built by
# panel.yml. Nothing here is built — the folder is hand-written HTML, CSS and one script,
# so what is published is byte for byte what is in the repository.
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One publish at a time. Two overlapping runs would race for the same site.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cheap guards against the two ways this page breaks silently: an <img> or a
      # stylesheet whose file was renamed, and a page that lost one of its languages.
      - name: check every local reference resolves
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          site = pathlib.Path("site")
          pages = sorted(site.glob("*.html"))
          if not pages:
              sys.exit("no pages found — the guard would have passed by checking nothing")

          problems = []
          for page in pages:
              html = page.read_text(encoding="utf-8")

              refs = re.findall(r'(?:src|href)="(?!https?:|#|mailto:)([^"]+)"', html)
              missing = [r for r in refs if not (site / r).exists()]

              langs = set(re.findall(r'data-lang="(\w+)"', html))

              print(f"{page.name}: {len(refs)} references, languages {sorted(langs)}")

              if missing:
                  problems.append(f"{page.name} points at missing files: {missing}")
              if langs != {"it", "en"}:
                  problems.append(f"{page.name} has languages {sorted(langs)}, expected both")

          if problems:
              sys.exit("\n".join(problems))
          PY

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SITE }}
          action: upload
          # Nothing to build: publish the folder as it stands.
          skip_app_build: true
          app_location: site
          output_location: ""
